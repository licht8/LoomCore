# Локальный dev-override (Linux/WSL/Docker Desktop).
#
# Запуск только БД + сборка/запуск hub без host-монтирований и привилегий:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   docker compose exec hub alembic upgrade head
#
# Отличия от прод-compose:
#   - hub теряет cap_add/volumes/security_opt (нет /lib/modules и /etc/wireguard),
#     поэтому инструменты loomwg, требующие реального WireGuard, работать не будут;
#   - для полноценной проверки плагина используйте WSL2/VDS (см. docs/setup/TESTING.md).
#
# Тег !reset требует Docker Compose 2.24+.

services:
  hub:
    cap_add: !reset null
    security_opt: !reset null
    volumes: !reset null
