map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream frontend {
    server 127.0.0.1:3000;
}

upstream backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Security headers. HSTS is added by the TLS block below (it must not be
    # sent over plain HTTP, or browsers would pin a scheme that does not work).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# TLS (strongly recommended). Admin credentials, the session cookie and the
# static admin token all travel over this listener, so without TLS they are
# sent in cleartext. To enable:
#
#   1. Obtain a certificate for your domain, e.g. with Certbot:
#        sudo certbot certonly --standalone -d loom.example.com
#      (stop the stack first so :80 is free, then start it again).
#   2. Copy the two files to ./deploy/nginx/certs/ and mount that directory
#      read-only into the nginx container (see docker-compose.yml).
#   3. Uncomment the server block below and set `server_name` and the cert
#      paths. Replace the :80 block's `location / { ... }` with a redirect to
#      `https://$host$request_uri` (keep `/.well-known/acme-challenge/` on :80
