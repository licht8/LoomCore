[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomcore"
version = "0.0.1"
description = "AI-Driven Infrastructure Hub"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "httpx",
    "python-dotenv",
    "pydantic",
    "mcp",
    "slowapi",
    "pyjwt>=2.13.0",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Ensure the repo root is importable when pytest runs as a console script
# (CI runs `uv run pytest`; cf. `python -m pytest` which adds the CWD).
pythonpath = ["."]
markers = [
    "integration: requires external services (Postgres)",
    "e2e: requires Linux and WireGuard (wg-quick)",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC"]
# BLE001/S110: broad-except на границах API/менеджера плагинов — намеренно.
ignore = ["BLE001", "S110"]

