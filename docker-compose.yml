services:
  db:
    image: postgres:16-alpine
    container_name: loom_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loomuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-loomcore}
    # Postgres is reachable from the host-networked hub via loopback only.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  hub:
    build: .
    container_name: loom_core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Host networking is required so the WireGuard interface and firewall/NAT
    # live in the host network namespace and external peers can connect.
    network_mode: host
    # Least privilege: only what WireGuard needs.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    security_opt:
      - no-new-privileges:false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loomuser}:${POSTGRES_PASSWORD:-secret_password}@127.0.0.1:5432/${POSTGRES_DB:-loomcore}
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
      DEBUG: ${DEBUG:-false}
      LOOMWG_ENDPOINT: ${LOOMWG_ENDPOINT:-}
      # On firewalld hosts (RHEL/Rocky) set to 1 and open UDP/NAT manually.
      LOOMWG_SKIP_FIREWALL: ${LOOMWG_SKIP_FIREWALL:-0}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    # API binds to loopback only; nginx is the single public entrypoint.
    command: uvicorn src.main:app --host 127.0.0.1 --port 8000
    volumes:
      # :z relabels for SELinux (RHEL/Rocky); harmless on other distros.
      - /etc/wireguard:/etc/wireguard:z
      - /lib/modules:/lib/modules:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loom_frontend
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    network_mode: host
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "3000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: loom_nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      hub:
        condition: service_healthy
    # Host mode binds :80 directly; keep it the only public port.
    network_mode: host
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata:
