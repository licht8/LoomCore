services:
  db:
    image: postgres:16-alpine
    container_name: loom_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loomuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-loomhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  hub:
    build: .
    container_name: loom_hub
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    privileged: true
    pid: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loomuser}:${POSTGRES_PASSWORD:-secret_password}@db:5432/${POSTGRES_DB:-loomhub}
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
      DEBUG: ${DEBUG:-false}
      LOOMHUB_MODE: self-hosted
      LOOMHUB_HOST_ROOT: /host
      LOOMWG_ENDPOINT: ${LOOMWG_ENDPOINT:-}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    volumes:
      - /:/host
      - /etc/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
      - /sys:/sys
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loom_frontend
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: loom_nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      hub:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata:
