services:
  db:
    image: postgres:16-alpine
    container_name: loom_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loomuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-loomcore}
    # Postgres is reachable from the host-networked hub via loopback only.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  hub:
    build: .
    container_name: loom_core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Host networking is required so the WireGuard interface and firewall/NAT
    # live in the host network namespace and external peers can connect.
    network_mode: host
    # Host PID namespace lets LoomOps read the host's processes and systemd units
    # (read-only observability; see docs/plugins/LoomOps.md).
    pid: host
    # Least privilege: only what WireGuard and LoomOps observability need.
    # SYS_MODULE is intentionally NOT granted: kernel WireGuard is in-tree on
    # Linux 5.6+, and the LoomWG manifest marks the capability as optional so
    # the plugin degrades to a host-side hint when the module must be loaded on
    # the host. Re-add it only if you need in-container `modprobe wireguard`
    # (which also requires the /lib/modules mount below). NET_RAW is not needed
    # for WireGuard: `wg`/`ip`/`iptables`/`nft` use NET_ADMIN only.
    cap_add:
      - NET_ADMIN
      - SYSLOG
    # Block setuid/setgid privilege escalation inside the container.
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loomuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@127.0.0.1:5432/${POSTGRES_DB:-loomcore}
      # Optional LLM bootstrap. Empty by default: the provider is chosen at
      # runtime in the app's Settings tab and persisted on the volume below.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CONNECT_TIMEOUT: ${LLM_CONNECT_TIMEOUT:-15}
      LLM_READ_TIMEOUT: ${LLM_READ_TIMEOUT:-90}
      LLM_WRITE_TIMEOUT: ${LLM_WRITE_TIMEOUT:-30}
      LLM_POOL_TIMEOUT: ${LLM_POOL_TIMEOUT:-15}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-0}
      LLM_THINKING_TEMPLATE: ${LLM_THINKING_TEMPLATE:-0}
      # Daily process-wide LLM call budget (0 = no guard).
      LLM_DAILY_CALL_LIMIT: ${LLM_DAILY_CALL_LIMIT:-1000}
      # Runtime provider config on the loomdata volume (settings tab writes here).
      LLM_SETTINGS_FILE: ${LLM_SETTINGS_FILE:-/data/llm.json}
      DEBUG: ${DEBUG:-false}
      # Gated agent latency timings (0=off). See src/core/timing.py.
      LOOMCORE_TIMING: ${LOOMCORE_TIMING:-0}
      LOOMWG_ENDPOINT: ${LOOMWG_ENDPOINT:-}
      # On firewalld hosts (RHEL/Rocky) set to 1 and open UDP/NAT manually.
      LOOMWG_SKIP_FIREWALL: ${LOOMWG_SKIP_FIREWALL:-0}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # "token" | "jwt" | "both" | "" (auto: jwt when password+TOTP is set).
      AUTH_MODE: ${AUTH_MODE:-}
      # Secure cookie + TLS are on by default; a deliberate opt-out is required
      # for plain-HTTP deployments (login refuses non-TLS requests otherwise).
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      REQUIRE_TLS: ${REQUIRE_TLS:-true}
      # Browser origins allowed by CORS (comma/space separated).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Persistent revoked-JWT store lives on the loomdata volume.
      LOOMCORE_REVOKED_FILE: ${LOOMCORE_REVOKED_FILE:-/data/revoked.json}
      # LoomOps is deny-by-default; empty command/path allowlists allow nothing.
      LOOMOPS_ALLOWED_COMMANDS: ${LOOMOPS_ALLOWED_COMMANDS:-}
      LOOMOPS_ALLOWED_PATHS: ${LOOMOPS_ALLOWED_PATHS:-}
      LOOMOPS_AUDIT_LOG: ${LOOMOPS_AUDIT_LOG:-}
      LOOMOPS_COMMAND_TIMEOUT: ${LOOMOPS_COMMAND_TIMEOUT:-30}
      # Host observability defaults (read-only); see docs/plugins/LoomOps.md.
      LOOMOPS_LOG_ROOTS: ${LOOMOPS_LOG_ROOTS:-/host/var/log}
      # Journal sources: persistent first, volatile (current boot) second.
      LOOMOPS_JOURNAL_DIRS: ${LOOMOPS_JOURNAL_DIRS:-/host/journal,/host/journal-volatile}
      LOOMOPS_MAX_LOG_LINES: ${LOOMOPS_MAX_LOG_LINES:-200}
      LOOMOPS_CPU_THRESHOLD: ${LOOMOPS_CPU_THRESHOLD:-80}
      LOOMOPS_DISK_THRESHOLD: ${LOOMOPS_DISK_THRESHOLD:-90}
      LOOMOPS_LOAD_THRESHOLD: ${LOOMOPS_LOAD_THRESHOLD:-2.0}
      PLUGINS_STATE_FILE: ${PLUGINS_STATE_FILE:-}
    # API binds to loopback only; nginx is the single public entrypoint.
    command: uvicorn src.main:app --host 127.0.0.1 --port 8000
    volumes:
      # :z relabels for SELinux (RHEL/Rocky); harmless on other distros.
      - /etc/wireguard:/etc/wireguard:z
      # Persistent revoked-JWT store (LOOMCORE_REVOKED_FILE=/data/revoked.json).
      - loomdata:/data
      # /lib/modules is intentionally NOT mounted: SYS_MODULE is not granted, so
      # `modprobe` cannot load a module anyway. Re-add `/lib/modules:/lib/modules:ro`
      # together with SYS_MODULE only if you need in-container `modprobe wireguard`.
      # Read-only host observability for LoomOps. Host paths are mounted under
      # /host/... so the container's own /etc and /var are not shadowed. On
      # SELinux hosts, relabel with `chcon`/`ausearch` — never `:z` on host
      # /etc or /var/log.
      - /var/log:/host/var/log:ro
      - /var/log/journal:/host/journal:ro
      # Volatile journal (current boot) for hosts without persistent journald.
      - /run/log/journal:/host/journal-volatile:ro
      - /run/systemd:/run/systemd:ro
      # The host D-Bus socket is intentionally NOT mounted: the read-only
      # /run/systemd mount already exposes systemd's private socket, which is
      # what `systemctl` uses as root. If your host's systemctl needs D-Bus,
      # re-add: /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # The host /etc is intentionally NOT mounted: no tool reads /host/etc.
      # Re-add `/etc:/host/etc:ro` only if you add tooling that needs it.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loom_frontend
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    network_mode: host
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "3000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: loom_nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      hub:
        condition: service_healthy
    # Host mode binds :80 directly; keep it the only public port.
    network_mode: host
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata:
  loomdata:
